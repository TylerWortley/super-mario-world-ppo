[project]
name = "super-mario-world-ppo"
version = "0.1.0"
description = "PPO from scratch, trained on Super Mario World and tested on unseen levels"
readme = "README.md"
authors = [
    { name = "Tyler Wortley", email = "tjawortley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "stable-baselines3[extra]>=2.9.2",
    "stable-retro",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppo", "smw"]

[tool.uv.sources]
stable-retro = { git = "https://github.com/Farama-Foundation/stable-retro.git" }
